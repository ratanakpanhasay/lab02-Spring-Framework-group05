
spring:
  datasource:
    url: "jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

logging:
  level:
    edu.itc.shop: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG


management:
  endpoint:
    health:
      show-components: always
      show-details: always